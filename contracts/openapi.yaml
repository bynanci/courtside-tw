components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC issuer/audience validated JWT for Spring Security.
    bffSession:
      type: apiKey
      in: cookie
      name: __Host-courtside_session
      description: Secure, HttpOnly, SameSite BFF session cookie.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    Limit:
      name: limit
      in: query
      required: false
      description: Bounded page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Current entity tag for a conditional public GET.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IssueSlug:
      name: issueSlug
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    ArticleSlug:
      name: articleSlug
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    ArticleId:
      name: articleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    Type:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum:
          - league
          - season
          - team
          - player
          - person
          - venue
          - topic
    ChainNamespace:
      name: chainNamespace
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9-]{1,31}$
    Address:
      name: address
      in: path
      required: true
      schema:
        type: string
        pattern: ^0x[0-9a-fA-F]{40}$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Optimistic-lock version or ETag. The server rejects stale values with 409 VERSION_CONFLICT.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable retry key. Replays return the original operation result.
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 200
  headers:
    XRequestId:
      description: Trace/request identifier. Never contains tokens or article content.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    ETag:
      description: Deterministic representation validator for conditional public reads.
      schema:
        type: string
        maxLength: 128
    RetryAfter:
      description: Seconds until the caller may retry.
      schema:
        type: integer
        minimum: 1
        maximum: 3600
  schemas:
    Uuid:
      type: string
      format: uuid
      description: Stable public identifier.
    UuidV7:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      description: Time-sortable UUIDv7 identifier.
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
