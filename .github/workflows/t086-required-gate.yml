              // always recomputes live state; it never republishes an older event payload.
              for(const row of open) {
                const pr=await prRead(row.number);
                if(pr.state==='open'&&pr.base.ref==='main') pending.push({pr,...await checkStart(pr)});
              }
              const main=(await github.rest.repos.getBranch({owner,repo,branch:'main'})).data;
              if(!main.protected) throw new Error('main is not protected');
              const workflowSource=await fileRead('.github/workflows/t086-required-gate.yml',main.commit.sha);
              const executingSource=await fileRead('.github/workflows/t086-required-gate.yml',process.env.TRUSTED_WORKFLOW_SHA);
              if(workflowSource.sha!==executingSource.sha) throw new Error('Executing evaluator is not current protected-main code');
              const comments=await paginated('GET /repos/{owner}/{repo}/issues/{issue_number}/comments',{issue_number:160});
              for(const item of pending) {
                const binding={candidate_sha:item.pr.head.sha,protected_base_sha:main.commit.sha,workflow_blob:workflowSource.sha,comment_fence:advanceCommentFence(item.fence,canonicalComment(comments),context.payload)};
                try {
                  const files=await paginated('GET /repos/{owner}/{repo}/pulls/{pull_number}/files',{pull_number:item.pr.number});
                  const classification=classifyCandidate(item.pr.number,files,item.pr.changed_files);
                  let state=null;
                  let result={decision:'HOLD',reasons:['Missing or ambiguous scope classification']};
                  if(classification==='NOT_APPLICABLE') result={decision:'NOT_APPLICABLE',reasons:['Complete GitHub file read-back contains no T086 release paths']};
                  if(classification==='T086') {state=await snapshot(item.pr,main.commit.sha,files,comments);state.commentFence=binding.comment_fence;result=evaluateSnapshot(state);Object.assign(binding,{frozen_t085_traceability_sha256:state.frozenHash,runs:state.runs,artifact:state.artifact,comment:result.comment});}
                  const [freshPr,freshMain,freshComments]=await Promise.all([prRead(item.pr.number),github.rest.repos.getBranch({owner,repo,branch:'main'}),paginated('GET /repos/{owner}/{repo}/issues/{issue_number}/comments',{issue_number:160})]);
                  if(freshPr.state!=='open'||freshPr.head.sha!==item.pr.head.sha||freshPr.base.ref!=='main'||freshMain.data.commit.sha!==main.commit.sha||!freshMain.data.protected||!equal(commentIdentity(canonicalComment(comments)),commentIdentity(canonicalComment(freshComments)))) throw new Error('Head, protected base or canonical comment changed during evaluation');
                  if(state?.runs) for(const expected of state.runs) {const {data:live}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:expected.id});if(live.run_attempt!==expected.attempt||live.updated_at!==expected.updated_at||live.conclusion!=='success'||live.status!=='completed') throw new Error('Workflow evidence changed during evaluation');}
                  await checkFinish(item.id,result,binding);item.finished=true;
                } catch(error) {await checkFinish(item.id,{decision:'HOLD',reasons:[error.message]},binding);item.finished=true;}
              }
            } finally {
              for(const item of pending.filter(item=>!item.finished)) await checkFinish(item.id,{decision:'HOLD',reasons:['Current GitHub read-back unavailable; prior success invalidated']},{candidate_sha:item.pr.head.sha,comment_fence:item.fence});
