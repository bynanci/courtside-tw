name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 11.7.0
  GRADLE_VERSION: 8.14.3

jobs:
  dependency-audit:
    name: Dependency audit and reports
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source head
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/verify-source-head.sh

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install JavaScript dependencies
        run: |
          set -o pipefail
          mkdir -p artifacts/dependency-audit
          pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee artifacts/dependency-audit/pnpm-install.log

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            apps/api/**/*.gradle*
            apps/api/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Audit pnpm dependencies
        id: pnpm-audit
        continue-on-error: true
        run: |
          mkdir -p artifacts/dependency-audit
          set +e
          pnpm audit --audit-level=high --json > artifacts/dependency-audit/pnpm-audit.json 2>&1
          status=$?
          cat artifacts/dependency-audit/pnpm-audit.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Resolve Gradle runtime dependency report
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain -p apps/api dependencies --configuration runtimeClasspath 2>&1 | tee artifacts/dependency-audit/gradle-runtime-classpath.log

      - name: Build Java dependencies for security scanning
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain -p apps/api test 2>&1 | tee artifacts/dependency-audit/gradle-security-resolution.log

      - name: Export resolved Gradle runtime classpath
        env:
          RUNTIME_CLASSPATH_OUTPUT: ${{ runner.temp }}/courtside-runtime-classpath.txt
        run: |
          set -euo pipefail
          init_script="$RUNNER_TEMP/export-runtime-classpath.gradle"
          cat > "$init_script" <<'EOF'
          def outputPath = System.getenv("RUNTIME_CLASSPATH_OUTPUT")
          if (!outputPath) {
              throw new GradleException("RUNTIME_CLASSPATH_OUTPUT is required")
          }

          gradle.beforeProject { project ->
              project.tasks.register("exportRuntimeClasspath") {
                  doLast {
                      def configuration = project.configurations.findByName("runtimeClasspath")
                      if (configuration == null) {
                          throw new GradleException("runtimeClasspath not found in ${project.path}")
                      }
                      def files = configuration.resolve().findAll { it.isFile() }.sort { left, right ->
                          left.name <=> right.name
                      }
                      def output = new File(outputPath)
                      output.parentFile.mkdirs()
                      output.text = files.collect { it.absolutePath }.join(System.lineSeparator()) + System.lineSeparator()
                  }
              }
          }
          EOF
          gradle --no-daemon --console=plain -p apps/api -I "$init_script" exportRuntimeClasspath
          test -s "$RUNTIME_CLASSPATH_OUTPUT"

      - name: Collect resolved Gradle artifacts
        run: |
          set -euo pipefail
          runtime_classpath="$RUNNER_TEMP/courtside-runtime-classpath.txt"
          test -s "$runtime_classpath"
          mkdir -p artifacts/dependency-audit/gradle-jars
          while IFS= read -r jar; do
            [ -n "$jar" ] || continue
            case "$jar" in
              *.jar) ;;
              *) echo "Unexpected runtime classpath entry: $jar" >&2; exit 1 ;;
            esac
            test -f "$jar"
            digest="$(sha256sum "$jar" | cut -d' ' -f1)"
            cp "$jar" "artifacts/dependency-audit/gradle-jars/${digest}-$(basename "$jar")"
          done < "$runtime_classpath"
          jar_count="$(find artifacts/dependency-audit/gradle-jars -type f -name '*.jar' | wc -l)"
          test "$jar_count" -gt 0
          cp "$runtime_classpath" artifacts/dependency-audit/runtime-classpath.txt

      - name: Scan resolved Gradle artifacts
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: artifacts/dependency-audit/gradle-jars
          scanners: vuln
          format: sarif
          output: artifacts/dependency-audit/trivy-gradle.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: "1"
          cache: true

      - name: Enforce dependency audit result
        if: ${{ always() }}
        run: |
          if [ "${{ steps.pnpm-audit.outcome }}" != "success" ]; then
            echo "pnpm audit reported high or critical findings"
            exit 1
          fi

      - name: Upload dependency reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-dependency-reports
          path: |
            artifacts/dependency-audit
            artifacts/exact-head.json
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source head
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/verify-source-head.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d97b3428e8eebbb1810cf454d6397886d136b4ba # v3.28.10
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up Java
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build Java for CodeQL tracing
        if: ${{ matrix.language == 'java-kotlin' }}
        run: gradle --no-daemon --console=plain -p apps/api compileJava

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@d97b3428e8eebbb1810cf454d6397886d136b4ba # v3.28.10
        with:
          category: /language:${{ matrix.language }}
          output: ${{ github.workspace }}/artifacts/codeql/${{ matrix.language }}
          upload: always

      - name: Upload CodeQL reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-codeql-${{ matrix.language }}
          path: |
            artifacts/codeql/${{ matrix.language }}
            artifacts/exact-head.json
          if-no-files-found: warn
          retention-days: 14

  compose-images:
    name: Resolve Compose images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source head
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/verify-source-head.sh

      - name: Resolve Compose image matrix
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          compose_json="$(docker compose --env-file infra/compose/.env.example --file infra/compose/compose.yaml config --format json)"
          matrix="$(jq -c '[.services | to_entries[] | {name: .key, service: .key, image: .value.image, build: (.value.build != null), output: ("artifacts/trivy-" + .key + ".sarif")}]' <<<"$compose_json")"
          test "$(jq 'length' <<<"$matrix")" -eq 3
          jq . <<<"$matrix" | tee artifacts/compose-images.json
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload resolved Compose image list
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-compose-images
          path: |
            artifacts/compose-images.json
            artifacts/exact-head.json
          retention-days: 14

  trivy-filesystem:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source head
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/verify-source-head.sh

      - name: Prepare scan output directory
        run: mkdir -p artifacts

      - name: Scan filesystem for vulnerabilities, secrets and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: artifacts/trivy-filesystem.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: "1"
          cache: true

      - name: Upload Trivy report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-trivy-filesystem
          path: |
            artifacts/trivy-filesystem.sarif
            artifacts/exact-head.json
          if-no-files-found: warn
          retention-days: 14

  trivy-compose-images:
    name: Trivy (image ${{ matrix.name }})
    needs: compose-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compose-images.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source head
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/verify-source-head.sh

      - name: Prepare scan output directory
        run: mkdir -p artifacts

      - name: Build Compose image
        if: ${{ matrix.build }}
        run: docker compose --env-file infra/compose/.env.example --file infra/compose/compose.yaml build --pull "${{ matrix.service }}"

      - name: Scan Compose container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          format: sarif
          output: ${{ matrix.output }}
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: "1"
          cache: true

      - name: Upload Trivy report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-trivy-${{ matrix.name }}
          path: |
            ${{ matrix.output }}
            artifacts/exact-head.json
          if-no-files-found: warn
          retention-days: 14
