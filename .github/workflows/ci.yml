name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 11.7.0
  GRADLE_VERSION: 8.14.3

jobs:
  frontend-contract:
    name: Frontend and contract verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source head
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/verify-source-head.sh

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install JavaScript dependencies
        run: |
          set -o pipefail
          mkdir -p artifacts/frontend
          pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee artifacts/frontend/pnpm-install.log

      - name: Validate ContentDocument contract
        run: pnpm run contract:schema

      - name: Validate first-issue seed pack
        run: node --experimental-strip-types scripts/content/import-seed.ts

      - name: Validate OpenAPI contract
        run: pnpm run contract:openapi

      - name: Run repository verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          make verify 2>&1 | tee artifacts/frontend/make-verify.log

      - name: Build and enforce public reader bundle budget
        run: |
          set -o pipefail
          pnpm --filter @courtside/web run test:bundle 2>&1 | tee artifacts/frontend/reader-bundle.log

      - name: Upload frontend and contract reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-frontend-reports
          path: |
            artifacts/frontend
            artifacts/performance
            artifacts/exact-head.json
            apps/**/coverage
            apps/**/test-results
            apps/**/.nuxt
          if-no-files-found: warn
          retention-days: 14

  web-e2e:
    name: Public magazine browser verification
    needs: frontend-contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source head
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/verify-source-head.sh

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: pnpm --filter @courtside/web exec playwright install --with-deps chromium

      - name: Run US1 independently
        run: |
          set -o pipefail
          mkdir -p artifacts/web-e2e
          pnpm --filter @courtside/web run test:us1 2>&1 | tee artifacts/web-e2e/playwright-us1.log

      - name: Run US2 independently
        run: |
          set -o pipefail
          pnpm --filter @courtside/web run test:us2 2>&1 | tee artifacts/web-e2e/playwright-us2.log

      - name: Run US1 and US2 together
        run: |
          set -o pipefail
          pnpm --filter @courtside/web run test:us1-us2 2>&1 | tee artifacts/web-e2e/playwright-us1-us2.log

      - name: Preserve the complete browser regression path
        run: |
          set -o pipefail
          pnpm --filter @courtside/web run test:e2e 2>&1 | tee artifacts/web-e2e/playwright-combined.log

      - name: Enforce T079 public-read performance budgets
        run: |
          set -o pipefail
          export CHROME_PATH="$(pnpm --filter @courtside/web exec node -e 'const { chromium } = require("@playwright/test"); process.stdout.write(chromium.executablePath())')"
          pnpm --filter @courtside/web run test:performance 2>&1 | tee artifacts/web-e2e/performance.log

      - name: Enforce mobile Lighthouse budgets
        run: |
          set -o pipefail
          export CHROME_PATH="$(pnpm --filter @courtside/web exec node -e 'const { chromium } = require("@playwright/test"); process.stdout.write(chromium.executablePath())')"
          pnpm --filter @courtside/web run test:lighthouse 2>&1 | tee artifacts/web-e2e/lighthouse.log

      - name: Upload browser verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-web-e2e-reports
          path: |
            artifacts/web-e2e
            artifacts/performance
            artifacts/exact-head.json
            apps/web/artifacts/lighthouse
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: warn
          retention-days: 14

  android-chrome-smoke:
    name: Android Chrome offline smoke
    needs: frontend-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COURTSIDE_ANDROID_AVD_NAME: courtside-api35-pixel7
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source head
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/verify-source-head.sh

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Chrome offline and performance smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          avd-name: ${{ env.COURTSIDE_ANDROID_AVD_NAME }}
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none
          disable-animations: true
          pre-emulator-launch-script: node apps/web/scripts/android-emulator-environment.mjs prepare artifacts/android-chrome/emulator-environment-prepare.json
          script: bash scripts/test/run-android-chrome-offline-smoke.sh

      - name: Upload Android Chrome smoke reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-android-chrome-reports
          path: |
            artifacts/android-chrome
            artifacts/exact-head.json
          if-no-files-found: warn
          retention-days: 14

  java-quality:
    name: Java quality and unit verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source head
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/verify-source-head.sh

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            apps/api/**/*.gradle*
            apps/api/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run Java quality and unit checks
        run: |
          set -o pipefail
          mkdir -p artifacts/api
          gradle --no-daemon --console=plain -p apps/api checkstyleMain spotbugsMain test 2>&1 | tee artifacts/api/gradle-quality.log

      - name: Upload Java reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-java-reports
          path: |
            artifacts/api
            artifacts/exact-head.json
            apps/api/build/reports
            apps/api/build/test-results
          if-no-files-found: warn
          retention-days: 14

  dependency-integration:
    name: Docker Compose dependency health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source head
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/verify-source-head.sh

      - name: Start dependencies and wait for health
        run: |
          set -o pipefail
          mkdir -p artifacts/dependencies
          DEPENDENCY_TIMEOUT_SECONDS=120 scripts/dev/check-dependencies.sh check 2>&1 | tee artifacts/dependencies/health-check.log

      - name: Verify T013 database foundation
        run: |
          set -o pipefail
          scripts/test/verify-database-foundation.sh 2>&1 | tee artifacts/dependencies/database-foundation.log

      - name: Verify V003 article contributor migration
        run: |
          set -o pipefail
          bash scripts/test/verify-article-contributors-migration.sh 2>&1 | tee artifacts/dependencies/article-contributors-migration.log

      - name: Verify editorial publication gate migration and hardening
        run: |
          set -o pipefail
          bash scripts/test/verify-editorial-publication-migration.sh 2>&1 | tee artifacts/dependencies/editorial-publication-migration.log

      - name: Verify T081 isolated backup restore
        run: |
          set -o pipefail
          mkdir -p artifacts/dependencies/t081
          T081_ARTIFACT_DIR=artifacts/dependencies/t081 bash scripts/test/verify-backup-restore.sh 2>&1 | tee artifacts/dependencies/t081/restore-verify.log

      - name: Verify T082 deployment and non-destructive application rollback
        run: |
          set -o pipefail
          mkdir -p artifacts/dependencies/t082
          T082_ARTIFACT_DIR=artifacts/dependencies/t082 bash scripts/test/verify-deployment-rollback.sh 2>&1 | tee artifacts/dependencies/t082/deployment-rollback.log

      - name: Upload exact-head T082 deployment rollback evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t082-deployment-rollback-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/dependencies/t082
          if-no-files-found: error
          retention-days: 14

      - name: Capture dependency status and clean up
        if: ${{ always() }}
        run: |
          mkdir -p artifacts/dependencies
          scripts/dev/check-dependencies.sh status > artifacts/dependencies/status.log 2>&1 || true
          scripts/dev/check-dependencies.sh down > artifacts/dependencies/cleanup.log 2>&1 || true

      - name: Upload dependency health reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-dependency-reports
          path: |
            artifacts/dependencies
            artifacts/exact-head.json
          if-no-files-found: warn
          retention-days: 14
