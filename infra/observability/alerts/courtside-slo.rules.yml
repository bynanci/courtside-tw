groups:
  - name: courtside-t083-telemetry-coverage
    interval: 30s
    rules:
      - alert: CourtsidePublicReadTelemetryMissing
        expr: >-
          absent(courtside_observability_source_up{surface="public-read"})
          or absent(courtside_slo_observations_total{surface="public-read"})
          or absent(courtside_slo_latency_seconds_bucket{surface="public-read"})
          or (time() - max(timestamp(courtside_observability_source_up{surface="public-read"}))) > 300
          or max(courtside_observability_source_up{surface="public-read"}) != 1
        for: 5m
        labels: { surface: public-read, owner: reader-operations, severity: page }
        annotations:
          summary: Public-read SLO telemetry is missing or stale
          description: The public-read source heartbeat is absent, older than five minutes, or unhealthy. Hold release interpretation; do not treat an empty denominator as green.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#public-read

      - alert: CourtsidePublicationTelemetryMissing
        expr: >-
          absent(courtside_observability_source_up{surface="publication-jobs"})
          or absent(courtside_slo_observations_total{surface="publication-jobs"})
          or (time() - max(timestamp(courtside_observability_source_up{surface="publication-jobs"}))) > 300
          or max(courtside_observability_source_up{surface="publication-jobs"}) != 1
        for: 5m
        labels: { surface: publication-jobs, owner: editorial-operations, severity: page }
        annotations:
          summary: Publication-job SLO telemetry is missing or stale
          description: The publication-job source heartbeat is absent, older than five minutes, or unhealthy. Keep publication release gates on HOLD.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#publication-jobs

      - alert: CourtsideWithdrawalTelemetryMissing
        expr: >-
          absent(courtside_observability_source_up{surface="withdrawal"})
          or absent(courtside_slo_observations_total{surface="withdrawal"})
          or (time() - max(timestamp(courtside_observability_source_up{surface="withdrawal"}))) > 300
          or max(courtside_observability_source_up{surface="withdrawal"}) != 1
        for: 5m
        labels: { surface: withdrawal, owner: rights-operations, severity: page }
        annotations:
          summary: Withdrawal SLO telemetry is missing or stale
          description: The non-privileged origin-withdrawal verifier is absent, stale, or unhealthy. Treat withdrawal assurance as unknown and HOLD.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#withdrawal

      - alert: CourtsideSearchFreshnessTelemetryMissing
        expr: >-
          absent(courtside_observability_source_up{surface="search-freshness"})
          or absent(courtside_slo_observations_total{surface="search-freshness"})
          or (time() - max(timestamp(courtside_observability_source_up{surface="search-freshness"}))) > 300
          or max(courtside_observability_source_up{surface="search-freshness"}) != 1
        for: 5m
        labels: { surface: search-freshness, owner: discovery-operations, severity: page }
        annotations:
          summary: Search-freshness SLO telemetry is missing or stale
          description: Search projection freshness cannot be attributed to current samples. Hold the affected release decision.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#search-freshness

      - alert: CourtsideMediaProcessingTelemetryMissing
        expr: >-
          absent(courtside_observability_source_up{surface="media-processing"})
          or absent(courtside_slo_observations_total{surface="media-processing"})
          or (time() - max(timestamp(courtside_observability_source_up{surface="media-processing"}))) > 300
          or max(courtside_observability_source_up{surface="media-processing"}) != 1
        for: 5m
        labels: { surface: media-processing, owner: media-operations, severity: page }
        annotations:
          summary: Media-processing SLO telemetry is missing or stale
          description: The accepted-image-to-READY source is absent, stale, or unhealthy. Keep media release interpretation on HOLD.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#media-processing

      - alert: CourtsideCachePurgeTelemetryMissing
        expr: >-
          absent(courtside_observability_source_up{surface="cache-purge"})
          or absent(courtside_slo_observations_total{surface="cache-purge"})
          or (time() - max(timestamp(courtside_observability_source_up{surface="cache-purge"}))) > 300
          or max(courtside_observability_source_up{surface="cache-purge"}) != 1
        for: 5m
        labels: { surface: cache-purge, owner: edge-operations, severity: page }
        annotations:
          summary: Withdrawal cache-purge telemetry is missing or stale
          description: Edge verification for withdrawal purge is absent, stale, or unhealthy. Do not infer cache safety from the origin alone.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#cache-purge

      - alert: CourtsideDeadLetterTelemetryMissing
        expr: >-
          absent(courtside_observability_source_up{surface="dead-letters"})
          or absent(courtside_outbox_handler_events_total{outcome="dead_lettered"})
          or (time() - max(timestamp(courtside_observability_source_up{surface="dead-letters"}))) > 300
          or max(courtside_observability_source_up{surface="dead-letters"}) != 1
        for: 5m
        labels: { surface: dead-letters, owner: platform-operations, severity: page }
        annotations:
          summary: Dead-letter telemetry is missing or stale
          description: Outbox dead-letter coverage is absent, stale, or unhealthy. Hold release and do not assume zero dead letters.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#dead-letters

  - name: courtside-t083-error-budget
    interval: 30s
    rules:
      - alert: CourtsidePublicReadFastBurn
        expr: >-
          (1 -
            sum(rate(courtside_slo_observations_total{surface="public-read",objective="availability",budget="met"}[5m]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="public-read",objective="availability"}[5m])), 0.000000001)
          ) > (14.4 * 0.001)
          and
          (1 -
            sum(rate(courtside_slo_observations_total{surface="public-read",objective="availability",budget="met"}[1h]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="public-read",objective="availability"}[1h])), 0.000000001)
          ) > (14.4 * 0.001)
        for: 2m
        labels: { surface: public-read, owner: reader-operations, severity: page }
        annotations:
          summary: Public-read availability is consuming error budget quickly
          description: Both 5-minute and 1-hour error ratios exceed the 14.4x burn threshold for the approved 99.9% monthly objective.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#public-read

      - alert: CourtsidePublicReadSlowBurn
        expr: >-
          (1 -
            sum(rate(courtside_slo_observations_total{surface="public-read",objective="availability",budget="met"}[30m]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="public-read",objective="availability"}[30m])), 0.000000001)
          ) > (6 * 0.001)
          and
          (1 -
            sum(rate(courtside_slo_observations_total{surface="public-read",objective="availability",budget="met"}[6h]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="public-read",objective="availability"}[6h])), 0.000000001)
          ) > (6 * 0.001)
        for: 15m
        labels: { surface: public-read, owner: reader-operations, severity: page }
        annotations:
          summary: Public-read availability has sustained error-budget burn
          description: Both 30-minute and 6-hour error ratios exceed the 6x burn threshold for the approved 99.9% monthly objective.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#public-read

      - alert: CourtsidePublicReadLatency
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(courtside_slo_latency_seconds_bucket{surface="public-read",objective="origin-latency"}[10m]))
          ) > 0.3
        for: 10m
        labels: { surface: public-read, owner: reader-operations, severity: page }
        annotations:
          summary: Public-read origin p95 exceeds 300 milliseconds
          description: The approved baseline-load origin p95 threshold has been exceeded for ten minutes. Confirm load attribution before a release decision.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#public-read

      - alert: CourtsidePublicationFastBurn
        expr: >-
          (1 -
            sum(rate(courtside_slo_observations_total{surface="publication-jobs",objective="completion",budget="met"}[5m]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="publication-jobs",objective="completion"}[5m])), 0.000000001)
          ) > (14.4 * 0.01)
          and
          (1 -
            sum(rate(courtside_slo_observations_total{surface="publication-jobs",objective="completion",budget="met"}[1h]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="publication-jobs",objective="completion"}[1h])), 0.000000001)
          ) > (14.4 * 0.01)
        for: 2m
        labels: { surface: publication-jobs, owner: editorial-operations, severity: page }
        annotations:
          summary: Publication completion is consuming error budget quickly
          description: Completed-or-explicitly-blocked publication commands within 60 seconds are below the approved 99% objective at both fast windows.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#publication-jobs

      - alert: CourtsidePublicationSlowBurn
        expr: >-
          (1 -
            sum(rate(courtside_slo_observations_total{surface="publication-jobs",objective="completion",budget="met"}[30m]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="publication-jobs",objective="completion"}[30m])), 0.000000001)
          ) > (6 * 0.01)
          and
          (1 -
            sum(rate(courtside_slo_observations_total{surface="publication-jobs",objective="completion",budget="met"}[6h]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="publication-jobs",objective="completion"}[6h])), 0.000000001)
          ) > (6 * 0.01)
        for: 15m
        labels: { surface: publication-jobs, owner: editorial-operations, severity: page }
        annotations:
          summary: Publication completion has sustained error-budget burn
          description: The approved 99%-within-60-seconds objective is burning at more than 6x across both slow windows.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#publication-jobs

      - alert: CourtsideWithdrawalFastBurn
        expr: >-
          (1 -
            sum(rate(courtside_slo_observations_total{surface="withdrawal",objective="origin-denial-30s",budget="met"}[5m]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="withdrawal",objective="origin-denial-30s"}[5m])), 0.000000001)
          ) > (14.4 * 0.01)
          and
          (1 -
            sum(rate(courtside_slo_observations_total{surface="withdrawal",objective="origin-denial-30s",budget="met"}[1h]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="withdrawal",objective="origin-denial-30s"}[1h])), 0.000000001)
          ) > (14.4 * 0.01)
        for: 1m
        labels: { surface: withdrawal, owner: rights-operations, severity: page }
        annotations:
          summary: Thirty-second withdrawal denial is consuming error budget quickly
          description: The 99%-within-30-seconds origin-denial objective exceeds its 14.4x burn threshold at both fast windows.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#withdrawal

      - alert: CourtsideWithdrawalSlowBurn
        expr: >-
          (1 -
            sum(rate(courtside_slo_observations_total{surface="withdrawal",objective="origin-denial-30s",budget="met"}[30m]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="withdrawal",objective="origin-denial-30s"}[30m])), 0.000000001)
          ) > (6 * 0.01)
          and
          (1 -
            sum(rate(courtside_slo_observations_total{surface="withdrawal",objective="origin-denial-30s",budget="met"}[6h]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="withdrawal",objective="origin-denial-30s"}[6h])), 0.000000001)
          ) > (6 * 0.01)
        for: 10m
        labels: { surface: withdrawal, owner: rights-operations, severity: page }
        annotations:
          summary: Thirty-second withdrawal denial has sustained error-budget burn
          description: The approved 99% objective exceeds its 6x burn threshold across both slow windows.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#withdrawal

      - alert: CourtsideWithdrawalSixtySecondBreach
        expr: >-
          sum(increase(courtside_slo_observations_total{surface="withdrawal",objective="origin-denial-60s",budget="missed"}[5m])) > 0
        for: 0m
        labels: { surface: withdrawal, owner: rights-operations, severity: critical }
        annotations:
          summary: A withdrawal was not denied by origin within 60 seconds
          description: The approved 100%-within-60-seconds safety invariant has one or more breaches. Contain the affected public route immediately.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#withdrawal

      - alert: CourtsideSearchFreshnessFastBurn
        expr: >-
          (1 -
            sum(rate(courtside_slo_observations_total{surface="search-freshness",objective="visible-in-search",budget="met"}[5m]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="search-freshness",objective="visible-in-search"}[5m])), 0.000000001)
          ) > (14.4 * 0.01)
          and
          (1 -
            sum(rate(courtside_slo_observations_total{surface="search-freshness",objective="visible-in-search",budget="met"}[1h]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="search-freshness",objective="visible-in-search"}[1h])), 0.000000001)
          ) > (14.4 * 0.01)
        for: 2m
        labels: { surface: search-freshness, owner: discovery-operations, severity: page }
        annotations:
          summary: Search freshness is consuming error budget quickly
          description: Public changes visible within 60 seconds are below the approved 99% objective at both fast windows.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#search-freshness

      - alert: CourtsideSearchFreshnessSlowBurn
        expr: >-
          (1 -
            sum(rate(courtside_slo_observations_total{surface="search-freshness",objective="visible-in-search",budget="met"}[30m]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="search-freshness",objective="visible-in-search"}[30m])), 0.000000001)
          ) > (6 * 0.01)
          and
          (1 -
            sum(rate(courtside_slo_observations_total{surface="search-freshness",objective="visible-in-search",budget="met"}[6h]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="search-freshness",objective="visible-in-search"}[6h])), 0.000000001)
          ) > (6 * 0.01)
        for: 15m
        labels: { surface: search-freshness, owner: discovery-operations, severity: page }
        annotations:
          summary: Search freshness has sustained error-budget burn
          description: The approved 99%-within-60-seconds objective exceeds its 6x burn threshold across both slow windows.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#search-freshness

      - alert: CourtsideMediaProcessingFastBurn
        expr: >-
          (1 -
            sum(rate(courtside_slo_observations_total{surface="media-processing",objective="ready",budget="met"}[5m]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="media-processing",objective="ready"}[5m])), 0.000000001)
          ) > (14.4 * 0.01)
          and
          (1 -
            sum(rate(courtside_slo_observations_total{surface="media-processing",objective="ready",budget="met"}[1h]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="media-processing",objective="ready"}[1h])), 0.000000001)
          ) > (14.4 * 0.01)
        for: 2m
        labels: { surface: media-processing, owner: media-operations, severity: page }
        annotations:
          summary: Media processing is consuming error budget quickly
          description: Rights-valid accepted images reaching READY within 300 seconds are below the approved 99% objective at both fast windows.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#media-processing

      - alert: CourtsideMediaProcessingSlowBurn
        expr: >-
          (1 -
            sum(rate(courtside_slo_observations_total{surface="media-processing",objective="ready",budget="met"}[30m]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="media-processing",objective="ready"}[30m])), 0.000000001)
          ) > (6 * 0.01)
          and
          (1 -
            sum(rate(courtside_slo_observations_total{surface="media-processing",objective="ready",budget="met"}[6h]))
            / clamp_min(sum(rate(courtside_slo_observations_total{surface="media-processing",objective="ready"}[6h])), 0.000000001)
          ) > (6 * 0.01)
        for: 15m
        labels: { surface: media-processing, owner: media-operations, severity: page }
        annotations:
          summary: Media processing has sustained error-budget burn
          description: The approved 99%-within-300-seconds objective exceeds its 6x burn threshold across both slow windows.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#media-processing

  - name: courtside-t083-safety-invariants
    interval: 30s
    rules:
      - alert: CourtsideWithdrawalCachePurgeBreach
        expr: >-
          sum(increase(courtside_slo_observations_total{surface="cache-purge",objective="withdrawal-purge",budget="missed"}[5m])) > 0
        for: 0m
        labels: { surface: cache-purge, owner: edge-operations, severity: critical }
        annotations:
          summary: A withdrawal remained available at the public edge after 60 seconds
          description: The withdrawal cache-purge safety invariant has one or more breaches. Bypass or disable the affected cache path and verify origin denial.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#cache-purge

      - alert: CourtsideDeadLettersDetected
        expr: >-
          sum(increase(courtside_outbox_handler_events_total{outcome="dead_lettered"}[5m])) > 0
        for: 0m
        labels: { surface: dead-letters, owner: platform-operations, severity: critical }
        annotations:
          summary: A durable outbox event entered the dead-letter state
          description: At least one new bounded event type was dead-lettered. Pause affected mutations and classify retryability before any replay.
          runbook_url: https://github.com/bynanci/courtside-tw/blob/main/docs/operations/incident-response.md#dead-letters
