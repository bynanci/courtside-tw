schema_version: mark-graphify-loop/v2
name: courtside-tw-t016-bff-controlled-security-lane
objective: "Run T016 as a controlled parallel security lane consuming T015's stable OIDC contract without touching T018, DB, OpenAPI or production identity systems."
feedback_updates_next_action: true

scope:
  in:
    - apps/web/server/auth/
    - apps/web/server/middleware/auth.ts
    - apps/web/tests/integration/auth-session.test.ts
    - T016 Graphify governance, evidence and ledger artifacts
  out:
    - T018 transactional outbox implementation
    - T017 audit writer
    - API OIDC role taxonomy or JWT validator changes
    - database migrations and OpenAPI changes
    - production IdP, credentials, tokens, private keys or deployment

authority:
  allowed:
    - read T015 terminal proof and ADR-0002
    - write local/CI OIDC-stub tests and bounded Nuxt BFF session code
    - run non-destructive security tests and open a draft PR
  requires_approval:
    - change the T015 identity contract
    - merge T016 or mark the checkbox complete
    - contact any production provider or use production secrets
  forbidden:
    - store tokens in browser storage
    - weaken Secure/HttpOnly/SameSite/CSRF/session-rotation controls
    - touch T018 outbox or database files

acceptance:
  - authorization-code/PKCE, state, nonce, redirect and code-verifier validation are explicit.
  - access/refresh tokens remain server-side; browser receives only secure session cookies.
  - session fixation, replay, logout/revocation and rotation are covered.
  - CSRF is enforced for cookie-authenticated mutations and safe public SSR remains anonymous.
  - role mapping consumes the T015 canonical role contract and rejects unknown/escalating claims.
  - local/CI OIDC stub integration tests cover provider outage without blocking published anonymous reading.
  - exact-head frontend/contract/security checks and scope inventory pass before merge.

budgets:
  max_iterations: 5
  max_minutes: 90
  max_same_failure: 2
  max_graph_changes: 10
  max_tokens: 30000

policy:
  human_gates:
    - T016 threat-model/security review
    - T016 exact-head integration/security proof
    - protected merge and checkbox completion
  mutation:
    append_only_evidence: true
    require_graph_delta: true

graph:
  entry_nodes: [x-t015-terminal-main, t-t016-lane-ready]
  terminal_nodes: [s-t016-security-stop]
  current_frontier: [g-t016-security-review]
  blocked_nodes: []
  nodes:
    - id: x-t015-terminal-main
      kind: external
      layer: EXTERNAL
      label: "T015 terminal main prerequisite"
      owner: github
      status: done
      risk: high
      confidence: {score: 1.0, basis: "main 05e891d has T015 checked", evidence_refs: [.loop/evidence/t015-post-receipt-main-readback-20260808.json]}

    - id: t-t016-lane-ready
      kind: trigger
      layer: L1
      label: "Controlled T016 security lane ready"
      owner: codex-supervisor
      status: done
      risk: critical
      confidence: {score: 0.98, basis: "T015 stable issuer/audience/role contract is available and T016 scope is separate", evidence_refs: [.loop/evidence/t016-security-lane-dispatch-20260808.json]}
      config:
        condition: "T015 terminal main read-back exists; local/CI OIDC stub is the only provider boundary."
        dedupe: "T016 + main 05e891d + BFF/PKCE/cookie/CSRF scope"

    - id: a-t016-security-charter
      kind: action
      layer: L1
      label: "Write T016 threat-model and integration tests first"
      owner: security-reviewer
      status: ready
      risk: critical
      confidence: {score: 0.9, basis: "Security acceptance and no-go conditions are recorded before runtime code", evidence_refs: [.loop/evidence/t016-security-lane-boundary-20260808.json]}
      config:
        allowed: [apps/web/tests/integration/auth-session.test.ts, T016 governance artifacts]
        requires_approval: [runtime cookie/session policy, merge, checkbox]
        forbidden: [production IdP, secrets, browser token storage, T018/API/DB scope]

    - id: p-t016-security-review
      kind: proof
      layer: L2
      label: "T016 threat-model and security acceptance proof"
      owner: security-reviewer
      status: planned
      risk: critical
      confidence: {score: 0.7, basis: "Lane is controlled but no implementation proof exists yet", evidence_refs: [.loop/evidence/t016-security-lane-boundary-20260808.json]}
      config: {level: P3, required: true, method: "Threat-model review plus local/CI OIDC-stub integration security tests"}

    - id: id-t016-implementation
      kind: action
      layer: L1
      label: "Implement bounded Nuxt BFF authorization-code/PKCE session"
      owner: codex-agent
      status: planned
      risk: critical
      confidence: {score: 0.7, basis: "Implementation is gated by security charter and T015 contract read-back", evidence_refs: [.loop/evidence/t016-security-lane-dispatch-20260808.json]}
      config:
        allowed: [apps/web/server/auth/, apps/web/server/middleware/auth/, apps/web/tests/integration/auth-session.test.ts]
        forbidden: [apps/api/, database/, contracts/openapi.yaml, production provider]

    - id: g-t016-security-review
      kind: gate
      layer: L2
      label: "T016 controlled security review and merge gate"
      owner: security-reviewer
      status: needs_human
      risk: critical
      confidence: {score: 0.8, basis: "Parallel lane is ready but security review and implementation proof are pending", evidence_refs: [.loop/evidence/t016-security-lane-boundary-20260808.json]}
      config:
        condition: "Threat-model proof, cookie/CSRF/session tests, exact-head checks and scope inventory pass."
        required: true

    - id: s-t016-security-stop
      kind: stop
      layer: GLOBAL
      label: "Stop T016 before provider or protected merge actions"
      owner: policy
      status: planned
      risk: critical
      confidence: {score: 1.0, basis: "T016 dispatch must not imply auth implementation or production-provider approval", evidence_refs: [.loop/evidence/t016-security-lane-dispatch-20260808.json]}

    - id: m-t016-ledger
      kind: memory
      layer: L1
      label: "Append-only T016 controlled security ledger"
      owner: codex-supervisor
      status: done
      risk: medium
      confidence: {score: 0.95, basis: "Lane boundary and next action are recorded before implementation", evidence_refs: [.loop/t016-bff-security-lane-ledger.json]}

  edges:
    - {id: e-t015-t016, from: x-t015-terminal-main, to: t-t016-lane-ready, type: enables, required: true, confidence: 1.0, token_capacity: 4000}
    - {id: e-trigger-charter, from: t-t016-lane-ready, to: a-t016-security-charter, type: enables, required: true, confidence: 0.95, token_capacity: 9000}
    - {id: e-charter-proof, from: a-t016-security-charter, to: p-t016-security-review, type: verifies, required: true, confidence: 0.8, token_capacity: 7000}
    - {id: e-proof-implementation, from: p-t016-security-review, to: id-t016-implementation, type: enables, required: true, confidence: 0.8, token_capacity: 14000}
    - {id: e-implementation-gate, from: id-t016-implementation, to: g-t016-security-review, type: requires_approval, required: true, confidence: 0.8, token_capacity: 7000}
    - {id: e-stop, from: g-t016-security-review, to: s-t016-security-stop, type: approves, required: true, confidence: 0.4, token_capacity: 4000}
    - {id: e-memory, from: m-t016-ledger, to: a-t016-security-charter, type: reads, required: true, confidence: 0.9, token_capacity: 3000}

flow:
  source: t-t016-lane-ready
  sink: s-t016-security-stop
  capacity_unit: tokens
  interpretation: planning-proxy

output_required:
  - decision
  - terminal_state
  - graph_summary
  - ready_frontier
  - critical_path
  - min_cut
  - proof_coverage
  - blockers_or_gates
  - graph_delta
  - memory_receipt
  - next_action
