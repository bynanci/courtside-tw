schema_version: mark-graphify-loop/v2
name: courtside-tw-t034-t041-us2-implementation-lane
objective: >-
  Open a reviewable Phase 4 US2 implementation lane from the latest T032/T033
  tests-first head, with T034/T035 as the first API vertical slice, while
  stopping before production runtime code until the ArticleProjection contract
  drift is explicitly resolved.
feedback_updates_next_action: true

scope:
  in:
    - T034 immutable published revision and server-side article projection logic
    - T035 public Article endpoint, ETag, visible media variants and issue navigation
    - T036-T041 bounded reader renderer, creative runtime, SSR route, progress, navigation, SEO and performance frontier
    - Latest-head baseline proof, contract-drift evidence, Graphify ledger and implementation-lane memory
    - P1 Magazine-first experience from Home to Issue to Article to Closure
  out:
    - T032/T033 checkbox updates or merge of the red tests-first PR before implementation proof passes
    - Any silent change to ArticleProjection field names or generated API contract
    - Database migration, editorial Studio workflow, real content publication or production deployment in this lane
    - Reader Stamp, Season Passport, wallet, token, NFT, IPFS, RPC, signer or external Web3 provider activation
    - Any external service that can block anonymous article reading

authority:
  allowed:
    - Read main, PR #63, tests, OpenAPI, schema, plan, tasks, ADRs and user-provided immersion review
    - Create a stacked implementation branch and draft PR from PR #63 latest head
    - Add bounded Graphify, evidence and semantic-memory artifacts
    - After contract approval, implement only the current T034/T035 slice and its required tests
    - Run focused checks and exact-head CI/Security
  requires_approval:
    - ArticleProjection contract or acceptance change
    - Production/runtime implementation after the contract gate
    - Protected merge, task checkbox updates, deployment or public content publication
    - Any database schema, rights policy, security boundary or Web3 scope change
  forbidden:
    - Return undeclared compatibility fields to hide the contract conflict
    - Modify or weaken T032/T033 assertions without recording an approved contract correction
    - Expose draft, withdrawn, historical or non-PUBLIC_WEB content
    - Dynamic module resolution, arbitrary HTML, remote code, shader, wallet or credential behavior

acceptance:
  - Latest PR #63 head, CI/Security #232 and zero review threads are read back exactly.
  - The lane is based on PR #63 head 49e3a1c and does not alter main or task checkboxes.
  - The contract mismatch is captured with both source references and an explicit human gate.
  - T034/T035 cannot enter production implementation until one ArticleProjection shape is approved.
  - Once approved, the first implementation slice must make the published positive test pass without weakening deny-by-default cases or rights filtering.
  - T036-T041 remain downstream of T034/T035 and preserve SSR/no-JS/reduced-motion and Web3 failure isolation.
  - The lane stops at needs_human, not success, while the contract decision is unresolved.

budgets:
  max_iterations: 5
  max_minutes: 180
  max_same_failure: 2
  max_no_evidence_delta: 2
  max_graph_changes: 20
  max_tokens: 80000

policy:
  human_gates:
    - ArticleProjection contract and acceptance decision
    - Protected merge and task checkbox updates
    - Production/runtime, schema, rights, security, deployment or Web3 changes
  no_progress:
    max_same_failure: 2
    max_no_evidence_delta: 2
  mutation:
    append_only_evidence: true
    require_graph_delta: true

memory_workflow:
  contract: work-memory/v1
  control_ledger: Append graph delta, proof receipts, failure signatures and token usage every iteration.
  semantic_memory: Capture only durable implementation-lane constraints and verified state deltas.
  modes: [recall, capture, update, forget, no_op]
  retrieval:
    levels: [index, timeline_relations, details]
    max_index_results: 10
    stop_on_sufficient_evidence: true
  capture:
    allowed_kinds: [decision, constraint, fact, attempt, task_state, pattern, evidence]
    requires_downstream_proof: true
    requires_write_receipt: true
  lifecycle: [seed, verified, stable, needs_update, disputed, archived]
  failure_policy:
    write_pending: blocked
    stale_or_disputed: needs_human
    redact_secrets: true

graph:
  entry_nodes: [x-main-readback, x-pr63-readback, x-immersion-review]
  terminal_nodes: [s-us2-implementation-terminal]
  current_frontier: [g-article-contract-approval]
  blocked_nodes: [t-implementation-ready, a-t034, a-t035, a-t036, a-t037, a-t038, a-t039, a-t040, a-t041]

  loops:
    - id: l2-implementation-lane-supervision
      layer: L2
      owner: codex-supervisor
      trigger_nodes: [t-lane-request]
      action_nodes: [a-open-lane]
      proof_nodes: [p-lane-scope]
      memory_nodes: [m-l2-ledger]
      stop_nodes: [s-us2-implementation-terminal]
      budgets:
        max_iterations: 3
        max_minutes: 30
        max_same_failure: 2
        max_graph_changes: 8
        max_tokens: 20000

    - id: l3-article-contract-direction
      layer: L3
      owner: human-mark
      trigger_nodes: [t-contract-review]
      action_nodes: [a-frame-article-contract]
      proof_nodes: [p-contract-review]
      memory_nodes: [m-l3-semantic]
      stop_nodes: [s-us2-implementation-terminal]
      budgets:
        max_iterations: 3
        max_minutes: 60
        max_same_failure: 2
        max_graph_changes: 8
        max_tokens: 24000

    - id: l1-us2-implementation
      layer: L1
      owner: codex-agent
      trigger_nodes: [t-implementation-ready]
      action_nodes: [a-t034, a-t035, a-t036, a-t037, a-t038, a-t039, a-t040, a-t041]
      proof_nodes: [p-t034, p-t035, p-t036, p-t037, p-t038, p-t039, p-t040, p-t041]
      memory_nodes: [m-l1-ledger]
      stop_nodes: [s-us2-implementation-terminal]
      budgets:
        max_iterations: 5
        max_minutes: 180
        max_same_failure: 2
        max_graph_changes: 20
        max_tokens: 80000

  nodes:
    - id: x-main-readback
      kind: external
      layer: EXTERNAL
      label: Authoritative main read-back after US1 completion
      owner: github
      status: done
      risk: high
      confidence:
        score: 1.0
        basis: "main@2ae2a5e is read back; T024-T031 are checked and T032/T033 remain unchecked."
        evidence_refs: ["https://github.com/bynanci/courtside-tw/commit/2ae2a5eeef9bc7ec3098b75205a7250e3a397960", "specs/001-taiwan-basketball-magazine-ebook/tasks.md"]
      budget: {effort_hours: 0.2, tokens: 2000}
      config:
        source_type: github-main-readback
        freshness: "2026-08-09T08:16:20Z"
        limitations: "US2 article runtime is intentionally absent from main."

    - id: x-pr63-readback
