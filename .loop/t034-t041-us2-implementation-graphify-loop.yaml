      owner: github
      status: done
      risk: high
      confidence:
        score: 1.0
        basis: "PR #63 head 49e3a1c is draft, unmerged, mergeable and has zero review threads; CI/Security #232 classify only intended red tests."
        evidence_refs: ["https://github.com/bynanci/courtside-tw/pull/63", ".loop/evidence/t034-latest-head-baseline-20260809.json"]
      budget: {effort_hours: 0.4, tokens: 4000}
