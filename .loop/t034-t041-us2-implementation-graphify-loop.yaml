    - id: x-immersion-review
      kind: external
      layer: EXTERNAL
      label: User-provided immersion review and product-direction evidence
      owner: human-mark
      status: done
      risk: high
      confidence:
        score: 0.95
        basis: "The supplied montage and presentation consistently define Magazine-first reading and Web3 as post-value, non-blocking infrastructure; usability scores are not measured evidence."
        evidence_refs: ["user-attachment:courtside-montage(1).png", "user-attachment:03-courtside-tw-user-immersion-review-1-1.pptx"]
      budget: {effort_hours: 0.4, tokens: 4000}
      config:
        source_type: user-provided-product-review
        freshness: "2026-08-09"
        limitations: "The attachment is a simulated product review, not measured user research."

    - id: t-lane-request
      kind: trigger
      layer: L2
      label: Mark requests a separate T034+ implementation lane
      owner: codex-supervisor
      status: done
      risk: high
      confidence:
        score: 1.0
