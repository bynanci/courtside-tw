graph_version: "2"
graph_id: "courtside-t042-t047-us3-publication-gate"
title: "US3 editorial publication gate"
objective: "Implement and verify the bounded domain and persistence guardrails needed before editorial publication commands can reach the public reader."
source_of_truth:
  repository: "bynanci/courtside-tw"
  base_ref: "main"
  base_commit: "fcc18d948073433d2a6e2397329391ef125c091c"
  task_file: "specs/001-taiwan-basketball-magazine-ebook/tasks.md"
  current_tasks: ["T042", "T045", "T046", "T047"]
scope:
  in:
    - "Publication state machine for editor and publisher roles"
    - "Rights/readiness gate with stable blocking codes"
    - "V004 append-only review, rights reference, snapshot, job, idempotency, and impact-link schema"
    - "Unit proof and isolated migration verification"
    - "CI wiring for the V004 verification script"
  out:
    - "T043 editorial HTTP integration endpoints"
    - "T044 Studio two-role browser flow"
    - "T048 signed upload completion and worker dispatch"
    - "T049-T056 full Studio CRUD and publish orchestration"
    - "Wallet, Passport, token, Web3 activation, deployment, production migration"
    - "Task checkbox edits and protected merge"
authority:
  allowed:
    - "Read the repository and supplied immersion-review artifacts"
    - "Create a bounded branch and draft pull request"
    - "Add domain code, tests, migration verification, graph ledger, and evidence receipts"
  requires_human_approval:
    - "Protected merge or making the pull request ready"
    - "Production migration or activation"
    - "Changing public API contracts outside the approved US3 slice"
    - "Marking task checkboxes complete"
  forbidden:
    - "Secrets or credential material"
    - "Direct production writes"
    - "Bypassing rights, role, or optimistic-lock checks"
acceptance:
  - "Only EDITOR may submit; only PUBLISHER may approve, schedule, publish, withdraw, or archive."
  - "Every successful transition advances the exact optimistic-lock version; blocked readiness leaves state and version unchanged."
  - "Readiness emits deterministic CONTENT_NOT_READY, RIGHTS_MISSING, RIGHTS_EXPIRED, RIGHTS_REVOKED, and RIGHTS_WRONG_CHANNEL codes."
  - "V004 applies after V001-V003, keeps review/snapshot/rights/impact records append-only, and enforces idempotency uniqueness."
  - "Unit tests, migration verification, Java quality, and security checks attach to the exact implementation head."
budgets:
  max_iterations: 5
  max_same_failure: 2
  max_no_evidence_delta: 2
  max_graph_changes: 20
