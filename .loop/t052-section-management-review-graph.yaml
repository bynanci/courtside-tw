schema_version: mark-graphify-loop/v2
name: courtside-tw-t052-section-management-review
objective: >-
  Complete T052 with a server-backed issue section API, explicit positions,
  aggregate If-Match concurrency, accessible keyboard reorder controls and
  exact-head review gates.
feedback_updates_next_action: true

scope:
  in:
    - T052 issue section CRUD and reorder API
    - Studio issue editor and accessible sortable TOC
    - OpenAPI and generated client contract
    - API and frontend proof tests
    - exact-head review, CI and protected merge receipts
  out:
    - production migration execution or activation
    - Web3, Wallet or Passport implementation
    - task checkbox mutation before merge proof

policy:
  human_gates:
    - Java 21, Gradle and Docker-backed API verification
    - Playwright Chromium execution
    - protected review, CI and merge
    - task checkbox update
  no_progress:
    max_same_failure: 2
    max_no_evidence_delta: 2
  mutation:
    append_only_evidence: true
    require_graph_delta: true

graph:
  entry_nodes: [t-t052-authorized]
  terminal_nodes: [s-local-proof-ready, s-remote-merge-gated]
  loops:
    - id: l1-t052-review
      layer: L1
      owner: codex-agent
      trigger_nodes: [t-t052-authorized]
      action_nodes: [a-t052-section-management]
      proof_nodes: [p-t052-local-proof, p-t052-exact-head-gate]
      memory_nodes: [m-t052-memory]
      stop_nodes: [s-local-proof-ready, s-remote-merge-gated]
      budgets:
        max_iterations: 3
        max_minutes: 60
        max_same_failure: 2
        max_graph_changes: 6
        max_tokens: 14000
  nodes:
    - id: t-t052-authorized
      kind: trigger
      layer: L1
      label: Implement missing T052 section management API and editor wiring
      owner: codex-agent
      status: done
      risk: high
      confidence:
        score: 0.98
        basis: User explicitly identified the absent backend API and requested verification, review and merge.
        evidence_refs: [fc9ff7a]
      budget: {effort_hours: 0.2, tokens: 600}
    - id: a-t052-section-management
      kind: action
      layer: L1
      label: Add section persistence, HTTP contract, Studio editor and fixture coverage
      owner: codex-agent
      status: done
      risk: high
      confidence:
        score: 0.92
        basis: The exact-head commit contains the API, migration, generated client, editor, component tests and e2e fixture/spec.
        evidence_refs: [fc9ff7a, .loop/evidence/t052-section-management-review-20260810.json]
      budget: {effort_hours: 4.0, tokens: 7000}
    - id: p-t052-local-proof
      kind: proof
      layer: L1
      label: Run available contract, frontend, build and source-level proofs
      owner: codex-agent
      status: done
      risk: medium
      confidence:
        score: 0.95
        basis: OpenAPI, content schema, generated client, web lint/typecheck/test/build and formatting passed at fc9ff7a.
        evidence_refs: [.loop/evidence/t052-section-management-review-20260810.json]
      budget: {effort_hours: 1.0, tokens: 2200}
    - id: p-t052-exact-head-gate
      kind: proof
      layer: L1
      label: Obtain Java, browser, review and protected merge evidence for the exact head
      owner: codex-agent
      status: planned
      risk: high
      confidence:
        score: 0.98
        basis: Local environment has Java 17, no Gradle/Docker and no Chromium; CI/protected workflow is required.
        evidence_refs: [.loop/evidence/t052-section-management-review-20260810.json]
      budget: {effort_hours: 2.0, tokens: 3000}
    - id: m-t052-memory
      kind: memory
      layer: L1
      label: Persist T052 proof and execution limits
      owner: codex-agent
      status: done
      risk: medium
      confidence:
        score: 0.95
        basis: The memory record references the exact commit, local receipts and remaining gates.
        evidence_refs: [.loop/memory/t052-section-management-review-20260810.json]
      budget: {effort_hours: 0.2, tokens: 900}
    - id: s-local-proof-ready
      kind: stop
      layer: GLOBAL
      label: T052 local implementation and available proof are ready
      owner: codex-agent
      status: done
      risk: medium
      confidence:
        score: 0.95
        basis: Local proof passed without substituting unavailable Java or browser execution.
        evidence_refs: [.loop/evidence/t052-section-management-review-20260810.json]
    - id: s-remote-merge-gated
      kind: stop
      layer: GLOBAL
      label: Hold completion until exact-head CI, review and merge read-back pass
      owner: codex-agent
      status: planned
      risk: high
      confidence:
        score: 0.98
        basis: Protected remote evidence has not yet been collected at the recorded local head.
        evidence_refs: [.loop/evidence/t052-section-management-review-20260810.json]
  edges:
    - {id: e-t052-authorize, from: t-t052-authorized, to: a-t052-section-management, type: enables, required: true, confidence: 0.98, token_capacity: 7000}
    - {id: e-t052-proof, from: a-t052-section-management, to: p-t052-local-proof, type: verifies, required: true, confidence: 0.92, token_capacity: 2200}
    - {id: e-t052-remote, from: p-t052-local-proof, to: p-t052-exact-head-gate, type: gates, required: true, confidence: 0.95, token_capacity: 3000}
    - {id: e-t052-memory, from: p-t052-local-proof, to: m-t052-memory, type: records, required: true, confidence: 0.95, token_capacity: 900}
    - {id: e-t052-ready, from: m-t052-memory, to: s-local-proof-ready, type: enables, required: true, confidence: 0.95, token_capacity: 900}
    - {id: e-t052-feedback, from: p-t052-exact-head-gate, to: a-t052-section-management, type: feedback, required: false, confidence: 0.8, token_capacity: 1200}
    - {id: e-t052-hold, from: p-t052-exact-head-gate, to: s-remote-merge-gated, type: blocks, required: false, confidence: 0.98, token_capacity: 900}

flow:
  source: t-t052-authorized
  sink: s-local-proof-ready
  capacity_unit: tokens
  interpretation: planning-proxy

output_required:
  - decision
  - terminal_state
  - graph_summary
  - ready_frontier
  - critical_path
  - token_flow
  - min_cut
  - proof_coverage
  - blockers_or_gates
  - graph_delta
  - memory_receipt
  - next_action
