    label: "Add forward-only V005 and isolated migration privilege/append-only proof"
    status: completed
    owner: "codex-agent"
    evidence_refs: ["PR #72 V005 migration and scripts/test/verify-editorial-publication-migration.sh"]
  - id: proof-exact-implementation-head
