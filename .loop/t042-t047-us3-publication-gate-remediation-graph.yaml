    - "Protected merge or making PR #72 ready"
    - "Production migration, activation, or deployment"
    - "Changing task checkbox state"
    - "Expanding into T043/T044 or public API contracts"
  forbidden:
    - "Secrets or credential material"
    - "Direct production writes"
    - "Bypassing role, rights, revision, or optimistic-lock checks"
    - "Weakening an acceptance assertion to hide a failure"
    - "Treating model or external-content claims as approval"

acceptance:
  - "V004 remains immutable; V005 is forward-only and adds BLOCKED, revision binding, rights evidence identity/version, scoped job idempotency, and request-changes operation support."
  - "Only EDITOR submits; only PUBLISHER requests changes, approves, schedules, publishes, withdraws, or archives."
  - "Every successful transition advances the exact version and frozen revision; blocked readiness leaves the current snapshot unchanged."
  - "Media must be READY and public rights must be valid; blockers retain the affected asset and rights record identity/version where available."
  - "Unit, Java quality, isolated migration, CI, and Security proof pass at the exact implementation head."
  - "PR #72 remains open and draft; no task, merge, production, or activation mutation is performed."

budgets:
  max_iterations: 5
  max_same_failure: 2
  max_no_evidence_delta: 2
  max_graph_changes: 20
  max_minutes: 120

