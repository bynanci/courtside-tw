scope:
  in:
    - "Actionable PR #70 review findings for the editorial publication gate"
    - "Frozen article-revision identity across review, rights evidence, and snapshots"
    - "Role-aware state transitions, request-changes, direct archive, and optimistic version checks"
    - "READY media plus rights identity/version evidence and stable readiness blockers"
    - "Forward-only V005 hardening and isolated V001-V005 migration verification"
    - "Bounded application idempotency policy and exact-head CI/Security receipts"
    - "Append-only Graphify, evidence, ledger, and semantic-memory receipts"
  out:
