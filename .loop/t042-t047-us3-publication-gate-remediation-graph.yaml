authority:
  allowed:
    - "Read the repository, PR #70 findings, and supplied immersion-review artifacts"
    - "Create the bounded remediation branch and draft PR #72"
    - "Add domain code, tests, V005, migration verification, and append-only receipts"
    - "Run exact-head CI and Security checks"
